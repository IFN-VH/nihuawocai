<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101114" />
  <title>你比划我猜 · 旋转感应 Demo</title>
  <style>
    :root{
      --bg:#0b0c10; --panel:#15171d; --panel2:#1d2028; --text:#f7f7fb;
      --muted:#a7abba; --accent:#8b5cf6; --good:#20c997; --skip:#ff8a4c;
      --danger:#ff5d73; --line:rgba(255,255,255,.1);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100dvh; background:
      radial-gradient(900px 500px at 20% -10%, rgba(139,92,246,.25), transparent 60%),
      linear-gradient(180deg,#0b0c10,#101116);
      color:var(--text); font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    button,input,textarea{font:inherit}
    button{cursor:pointer}
    .app{max-width:760px;margin:0 auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .brand{font-size:18px;font-weight:800;letter-spacing:.02em}
    .pill{font-size:12px;color:var(--muted);padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.04)}
    .screen{display:none}.screen.active{display:block}
    .hero{padding:26px 0 18px}
    .hero h1{font-size:clamp(34px,9vw,66px);line-height:1.02;margin:0 0 14px;letter-spacing:-.05em}
    .hero p{color:var(--muted);font-size:16px;line-height:1.65;margin:0}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}
    .card{background:rgba(24,26,33,.86);border:1px solid var(--line);border-radius:22px;padding:18px;backdrop-filter:blur(10px)}
    .card h3{margin:0 0 8px;font-size:16px}.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
    .btn{width:100%;border:0;border-radius:17px;padding:15px 18px;font-weight:800;color:#fff;background:var(--accent);box-shadow:0 10px 30px rgba(139,92,246,.22)}
    .btn.secondary{background:var(--panel2);box-shadow:none;border:1px solid var(--line)}
    .btn.good{background:var(--good);box-shadow:none}.btn.skip{background:var(--skip);box-shadow:none}
    .btn + .btn{margin-top:10px}
    .section-title{display:flex;justify-content:space-between;align-items:center;margin:8px 0 10px}
    .section-title h2{font-size:18px;margin:0}.section-title span{font-size:12px;color:var(--muted)}
    textarea,input{
      width:100%;border:1px solid var(--line);border-radius:16px;background:#111319;color:var(--text);
      padding:14px;outline:none;
    }
    textarea{min-height:180px;resize:vertical;line-height:1.6}
    .hint{color:var(--muted);font-size:12px;line-height:1.6;margin:10px 2px 18px}
    .game{
      min-height:calc(100dvh - 60px);display:flex;flex-direction:column;justify-content:center;gap:18px;
      text-align:center;transition:background .18s ease;
    }
    .game.flash-good{background:rgba(32,201,151,.16)} .game.flash-skip{background:rgba(255,138,76,.16)}
    .scorebar{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
    .scorebar span{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.04);font-size:13px}
    .word-card{
      min-height:300px;display:flex;align-items:center;justify-content:center;padding:28px 20px;
      border-radius:32px;border:1px solid rgba(255,255,255,.12);
      background:linear-gradient(145deg,rgba(139,92,246,.26),rgba(255,255,255,.05));
      box-shadow:0 25px 80px rgba(0,0,0,.35);
    }
    #currentWord{font-size:clamp(42px,13vw,92px);font-weight:900;letter-spacing:-.05em;line-height:1.05}
    .motion-state{font-size:13px;color:var(--muted);min-height:20px}
    .controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .tiny{font-size:12px;color:var(--muted)}
    .calibration{padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.03)}
    .result-num{font-size:64px;font-weight:900;margin:10px 0 0}
    .result-label{color:var(--muted)}
    .history{display:flex;flex-direction:column;gap:8px;margin:16px 0}
    .history-row{display:flex;justify-content:space-between;gap:12px;padding:11px 13px;border-radius:14px;background:rgba(255,255,255,.04);font-size:14px}
    .good-text{color:var(--good)} .skip-text{color:var(--skip)}
    @media(max-width:520px){.grid{grid-template-columns:1fr}.app{padding-top:12px}.word-card{min-height:270px}}
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div class="brand">🎭 你比划我猜</div>
      <div class="pill" id="sensorPill">传感器未启用</div>
    </div>

    <section id="homeScreen" class="screen active">
      <div class="hero">
        <h1>举到额头，<br>转一下就判题。</h1>
        <p>手机向前倾：猜对。向后倾：跳过。你也可以创建自己的游戏题库。</p>
      </div>

      <div class="grid">
        <div class="card"><h3>✅ 向前倾</h3><p>判定“猜对”，自动切到下一题。</p></div>
        <div class="card"><h3>⏭️ 向后倾</h3><p>判定“跳过”，继续下一题。</p></div>
      </div>

      <button class="btn" id="quickStartBtn">开始默认题库</button>
      <button class="btn secondary" id="editBankBtn">创建 / 编辑题库</button>
      <p class="hint">首次开始时可能需要点按按钮授权“动作与方向”访问。电脑上可直接用底部按钮测试。</p>
    </section>

    <section id="bankScreen" class="screen">
      <div class="section-title"><h2>自定义题库</h2><span id="wordCount">0 题</span></div>
      <textarea id="bankInput" placeholder="每行一道题，例如：&#10;熊猫&#10;打篮球&#10;周杰伦"></textarea>
      <p class="hint">每行一题。保存后会存进当前浏览器的 localStorage。</p>
      <button class="btn" id="saveBankBtn">保存并开始</button>
      <button class="btn secondary" id="backHomeBtn">返回</button>
    </section>

    <section id="gameScreen" class="screen">
      <div class="game" id="gameArea">
        <div class="scorebar">
          <span>✅ <b id="correctCount">0</b></span>
          <span>⏭️ <b id="skipCount">0</b></span>
          <span>剩余 <b id="remainingCount">0</b></span>
        </div>

        <div class="word-card"><div id="currentWord">准备开始</div></div>

        <div class="calibration">
          <div class="motion-state" id="motionState">保持当前姿势，点击“校准中立角度”</div>
          <div class="tiny">当前 β：<span id="betaValue">--</span>° ｜ 基准：<span id="baseValue">--</span>°</div>
        </div>

        <div class="controls">
          <button class="btn good" id="correctBtn">猜对</button>
          <button class="btn skip" id="skipBtn">跳过</button>
        </div>
        <button class="btn secondary" id="calibrateBtn">校准中立角度</button>
        <button class="btn secondary" id="endBtn">结束本轮</button>
      </div>
    </section>

    <section id="resultScreen" class="screen">
      <div class="hero">
        <p class="result-label">本轮猜对</p>
        <div class="result-num" id="resultCorrect">0</div>
      </div>
      <div class="history" id="historyList"></div>
      <button class="btn" id="restartBtn">再来一轮</button>
      <button class="btn secondary" id="resultHomeBtn">回到首页</button>
    </section>
  </main>

<script>
(() => {
  const DEFAULT_WORDS = ["熊猫","打篮球","火锅","周杰伦","自拍","孙悟空","下雨","冰淇淋","奥特曼","坐过山车","程序员","小龙虾"];
  const $ = id => document.getElementById(id);
  const screens = ["homeScreen","bankScreen","gameScreen","resultScreen"];

  let words = [];
  let queue = [];
  let current = "";
  let correct = 0;
  let skipped = 0;
  let history = [];

  // 旋转检测：beta 是绕设备 X 轴的前后倾斜角。
  // 为了适应不同拿法，开始后以当前 beta 为基准，只判断“相对变化”。
  let latestBeta = null;
  let baseBeta = null;
  let sensorEnabled = false;
  let locked = false;
  let neutralSince = 0;

  const THRESHOLD = 28;       // 相对基准倾斜超过 28° 触发
  const RELEASE_ZONE = 12;    // 回到 ±12° 后才允许下一次触发
  const COOLDOWN_MS = 700;

  function show(id){
    screens.forEach(s => $(s).classList.toggle("active", s === id));
  }

  function savedWords(){
    try {
      const parsed = JSON.parse(localStorage.getItem("charadesWords") || "null");
      return Array.isArray(parsed) && parsed.length ? parsed : DEFAULT_WORDS;
    } catch { return DEFAULT_WORDS; }
  }

  function shuffle(arr){
    const a = [...arr];
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  async function enableSensor(){
    if (!("DeviceOrientationEvent" in window)) {
      $("sensorPill").textContent = "设备不支持方向传感器";
      return false;
    }
    try {
      // Safari / iOS 等浏览器可能要求用户手势触发权限请求
      if (typeof DeviceOrientationEvent.requestPermission === "function") {
        const permission = await DeviceOrientationEvent.requestPermission();
        if (permission !== "granted") throw new Error("permission denied");
      }
      if (!sensorEnabled) {
        window.addEventListener("deviceorientation", onOrientation, { passive:true });
        sensorEnabled = true;
      }
      $("sensorPill").textContent = "传感器已启用";
      return true;
    } catch (err) {
      $("sensorPill").textContent = "传感器未授权";
      $("motionState").textContent = "未获得传感器权限，可使用“猜对 / 跳过”按钮";
      return false;
    }
  }

  function onOrientation(e){
    if (typeof e.beta !== "number") return;
    latestBeta = e.beta;
    $("betaValue").textContent = latestBeta.toFixed(1);

    if (baseBeta === null || !current) return;
    const delta = latestBeta - baseBeta;

    if (Math.abs(delta) < RELEASE_ZONE) {
      if (!neutralSince) neutralSince = Date.now();
      if (Date.now() - neutralSince > 180) locked = false;
      $("motionState").textContent = "中立位置 · 可以判题";
    } else {
      neutralSince = 0;
    }

    if (locked) return;

    if (delta >= THRESHOLD) {
      locked = true;
      mark("correct");
    } else if (delta <= -THRESHOLD) {
      locked = true;
      mark("skip");
    } else {
      $("motionState").textContent = delta > 0 ? "正在向前倾…" : "正在向后倾…";
    }
  }

  function calibrate(){
    if (latestBeta === null) {
      $("motionState").textContent = "还没读到方向数据，请确认权限并在真机测试";
      return;
    }
    baseBeta = latestBeta;
    locked = false;
    neutralSince = Date.now();
    $("baseValue").textContent = baseBeta.toFixed(1);
    $("motionState").textContent = "校准完成 · 保持这个姿势作为中立位置";
  }

  async function startGame(customWords){
    words = customWords && customWords.length ? customWords : savedWords();
    queue = shuffle(words);
    correct = 0; skipped = 0; history = [];
    baseBeta = null; locked = false; neutralSince = 0;
    show("gameScreen");
    updateScore();
    await enableSensor();
    nextWord();

    // 读到传感器数据后自动用当前姿势做一次初始校准
    setTimeout(() => {
      if (latestBeta !== null && baseBeta === null) calibrate();
    }, 500);
  }

  function nextWord(){
    if (!queue.length) return endGame();
    current = queue.shift();
    $("currentWord").textContent = current;
    updateScore();
  }

  function mark(type){
    if (!current) return;
    const judgedWord = current;

    if (type === "correct") correct++;
    else skipped++;

    history.push({ word: judgedWord, type });
    current = "";
    flash(type);
    updateScore();

    setTimeout(() => {
      nextWord();
      // 必须回到中立区才会再次解锁，避免一次倾斜连续触发
    }, 260);
  }

  function flash(type){
    const cls = type === "correct" ? "flash-good" : "flash-skip";
    $("gameArea").classList.add(cls);
    setTimeout(() => $("gameArea").classList.remove(cls), 220);
  }

  function updateScore(){
    $("correctCount").textContent = correct;
    $("skipCount").textContent = skipped;
    $("remainingCount").textContent = queue.length + (current ? 1 : 0);
  }

  function endGame(){
    current = "";
    $("resultCorrect").textContent = correct;
    $("historyList").innerHTML = history.length
      ? history.map(x => `<div class="history-row"><span>${escapeHtml(x.word)}</span><b class="${x.type === "correct" ? "good-text" : "skip-text"}">${x.type === "correct" ? "猜对" : "跳过"}</b></div>`).join("")
      : `<div class="history-row"><span>这轮还没有判题</span></div>`;
    show("resultScreen");
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  }

  $("quickStartBtn").addEventListener("click", () => startGame());
  $("editBankBtn").addEventListener("click", () => {
    const list = savedWords();
    $("bankInput").value = list.join("\n");
    $("wordCount").textContent = `${list.length} 题`;
    show("bankScreen");
  });
  $("bankInput").addEventListener("input", e => {
    const list = e.target.value.split("\n").map(x => x.trim()).filter(Boolean);
    $("wordCount").textContent = `${list.length} 题`;
  });
  $("saveBankBtn").addEventListener("click", () => {
    const list = $("bankInput").value.split("\n").map(x => x.trim()).filter(Boolean);
    if (!list.length) return alert("请至少输入一道题");
    localStorage.setItem("charadesWords", JSON.stringify([...new Set(list)]));
    startGame([...new Set(list)]);
  });
  $("backHomeBtn").addEventListener("click", () => show("homeScreen"));
  $("correctBtn").addEventListener("click", () => mark("correct"));
  $("skipBtn").addEventListener("click", () => mark("skip"));
  $("calibrateBtn").addEventListener("click", calibrate);
  $("endBtn").addEventListener("click", endGame);
  $("restartBtn").addEventListener("click", () => startGame(words));
  $("resultHomeBtn").addEventListener("click", () => show("homeScreen"));
})();
</script>
</body>
</html>
